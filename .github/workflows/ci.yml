name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so upstream breakage (renamed release assets, runner image
  # changes) shows up before a machine's scheduled update hits it.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint
        run: |
          shellcheck -S warning \
            install.sh bootstrap.sh \
            bash/.bashrc bash/.bash_profile \
            bash-linux/.bashrc.d/*.sh \
            shell/.config/shell/common.sh \
            local/.local/bin/tmux-copy \
            local/.local/bin/dotfiles-sync

  downloads:
    name: installer download sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Every URL install.sh fetches still resolves
        run: ./install.sh --check-urls

  smoke:
    name: stow + doctor (${{ matrix.os }})
    needs: shellcheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTFILES: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install stow and zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq stow zsh

      - name: Install stow (macOS)
        if: runner.os == 'macOS'
        run: brew install stow

      - name: Stow all packages (backs up runner defaults)
        run: ./install.sh --only stow

      - name: Stow is idempotent
        run: ./install.sh --only stow

      - name: Repo must stay clean after stowing
        run: test -z "$(git status --porcelain --untracked-files=no)" || { git status; exit 1; }

      - name: Shell configs load without errors (bash)
        run: |
          set -o pipefail
          err="$(bash -lc 'source ~/.bashrc; echo "$EDITOR"; echo loaded' 2>&1 >/dev/null)"
          echo "stderr: ${err:-<none>}"
          test -z "$err"

      - name: Shell configs load without errors (zsh)
        run: |
          err="$(zsh -c 'source ~/.zshrc; echo loaded' 2>&1 >/dev/null)"
          echo "stderr: ${err:-<none>}"
          test -z "$err"

      - name: Git identity routing (work for ~/xAI or teachx GitLab remotes)
        run: |
          set -eu
          check() { got="$(git -C "$1" config user.email)"; echo "$1 -> $got"; test "$got" = "$2"; }
          t="$(mktemp -d)"
          git init -q "$t/gitlab"     && git -C "$t/gitlab" remote add origin git@ssh.nova.teachx.ai:teachxai/x.git
          git init -q "$t/gitlab-url" && git -C "$t/gitlab-url" remote add origin ssh://git@ssh.nova.teachx.ai/teachxai/x.git
          git init -q "$t/github"     && git -C "$t/github" remote add origin git@github.com:DJPillu/x.git
          mkdir -p "$HOME/xAI" && git init -q "$HOME/xAI/no-remote"
          check "$t/gitlab"           rarora@teachx.ai
          check "$t/gitlab-url"       rarora@teachx.ai
          check "$HOME/xAI/no-remote" rarora@teachx.ai
          check "$t/github"           rujularoracs@gmail.com

      - name: Windows sync module (fake %USERPROFILE%)
        run: |
          set -eu
          WIN_HOME="$(mktemp -d)"; export WIN_HOME
          ./install.sh --only windows
          out="$(./install.sh --only windows)"
          echo "$out"
          test "$(echo "$out" | grep -c 'already in sync')" -eq 3
          test "$(git config -f "$WIN_HOME/.gitconfig.local" core.autocrlf)" = true
          test "$(git config -f "$WIN_HOME/.gitconfig" user.email)" = rujularoracs@gmail.com

      - name: Schedule module (runners have no user systemd / GUI launchd; must not fail)
        run: ./install.sh --only schedule

      - name: LaunchAgent plist is valid (macOS)
        if: runner.os == 'macOS'
        run: plutil -lint ~/Library/LaunchAgents/com.djpillu.dotfiles-sync.plist

      # /bin/bash is 3.2 on macOS, which is what launchd uses.
      - name: dotfiles-sync runs end to end (align only)
        run: |
          /bin/bash "$HOME/.local/bin/dotfiles-sync" --no-update
          "$HOME/.local/bin/dotfiles-sync" --status
          test -s "$HOME/.local/state/dotfiles/status"

      - name: Doctor (informational — tools are not installed on runners)
        continue-on-error: true
        run: ./install.sh --check
