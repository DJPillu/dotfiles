name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint
        run: |
          shellcheck -S warning \
            install.sh bootstrap.sh \
            bash/.bashrc bash/.bash_profile \
            bash-linux/.bashrc.d/*.sh \
            shell/.config/shell/common.sh \
            local/.local/bin/tmux-copy

  smoke:
    name: stow + doctor (${{ matrix.os }})
    needs: shellcheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTFILES: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stow and zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq stow zsh

      - name: Install stow (macOS)
        if: runner.os == 'macOS'
        run: brew install stow

      - name: Stow all packages (backs up runner defaults)
        run: ./install.sh --only stow

      - name: Stow is idempotent
        run: ./install.sh --only stow

      - name: Repo must stay clean after stowing
        run: test -z "$(git status --porcelain --untracked-files=no)" || { git status; exit 1; }

      - name: Shell configs load without errors (bash)
        run: |
          set -o pipefail
          err="$(bash -lc 'source ~/.bashrc; echo "$EDITOR"; echo loaded' 2>&1 >/dev/null)"
          echo "stderr: ${err:-<none>}"
          test -z "$err"

      - name: Shell configs load without errors (zsh)
        run: |
          err="$(zsh -c 'source ~/.zshrc; echo loaded' 2>&1 >/dev/null)"
          echo "stderr: ${err:-<none>}"
          test -z "$err"

      - name: Doctor (informational — tools are not installed on runners)
        continue-on-error: true
        run: ./install.sh --check
